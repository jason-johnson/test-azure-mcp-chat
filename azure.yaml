name: azure-support-assistant
metadata:
  template: azure-support-assistant@0.0.1
services:
  api:
    project: ./api/prototype_copilot_sdk
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      context: ../..
      remoteBuild: true
      buildArgs:
        - REACT_APP_MCP_CLIENT_ID=${CLIENT_APP_CLIENT_ID}
        - REACT_APP_TENANT_ID=${AZURE_TENANT_ID}