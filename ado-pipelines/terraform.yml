# REQUIREMENTS: none
# OPTIONAL GLOBAL VARIABLES:
#   Container - name of the container your terraform config is stored
#   StorageAccount - name of the storage account your terraform config is stored
#   ResourceGroupName - name of the resource group your terraform config storage account is in
# OUTPUTS:
#  TerraformApply.outputs['Terraform.$output']
#     These are created for each of your terraform main outputs, using the terraform output name
parameters:
  - name: terraformVersion
  - name: terraformPath
  - name: servicePrinciple
  - name: containerName
    default: $(Container)
  - name: storageAccountName
    default: $(StorageAccount)
  - name: resourceGroupName
    default: $(ResourceGroupName)
  - name: action
    default: 'apply'
  - name: commandOptions
    default: ''
  - name: useWorkspace
    default: false
  - name: workspace
    default: ''
  - name: preActionSteps
    type: stepList
    default: []
  - name: preDestroySteps
    type: stepList
    default: []
  - name: secrets
    type: object
    default: []
  - name: env
    type: object
    default: []

steps:
  - task: ms-devlabs.custom-terraform-tasks.custom-terraform-installer-task.TerraformInstaller@1
    displayName: Install Terraform
    inputs:
      terraformVersion: ${{ parameters.terraformVersion }}
  
  - task: TerraformTask@5
    displayName: 'terraform init'
    inputs:
      command: init
      provider: azurerm
      backendServiceArm: ${{ parameters.servicePrinciple }}
      backendAzureRmResourceGroupName: ${{ parameters.resourceGroupName }}
      backendAzureRmStorageAccountName: ${{ parameters.storageAccountName }}
      backendAzureRmContainerName: ${{ parameters.containerName }}
      backendAzureRmKey: terraform.tfstate
      workingDirectory: ${{ parameters.terraformPath }}

  - ${{ if eq(parameters.useWorkspace, true) }}:
    - task: TerraformTask@5
      displayName: Select Workspace
      inputs:
        provider: azurerm
        workingDirectory: ${{ parameters.terraformPath }}
        command: custom
        customCommand: workspace
        commandOptions: 'select -or-create "${{ parameters.workspace }}"'
        environmentServiceNameAzureRM: ${{ parameters.servicePrinciple }}
        environmentAzureRmUseIdTokenGeneration: true

  - ${{ if or(gt(length(parameters.preDestroySteps), 0), gt(length(parameters.preActionSteps), 0)) }}:
    - task: TerraformTask@5
      name: TerraformPreOutputs
      displayName: 'terraform output'
      inputs:
        provider: azurerm
        command: output
        environmentServiceNameAzureRM: ${{ parameters.servicePrinciple }}
        environmentAzureRmUseIdTokenGeneration: true
        workingDirectory: ${{ parameters.terraformPath }}

    - powershell: |
        $outputs = Get-Content -Raw -LiteralPath $env:TERRAFORM_OUTPUTS_PATH | ConvertFrom-Json
        foreach ($output in $outputs.PSObject.Properties) {
          $name = "TF_OUT_$($output.Name.ToUpperInvariant())"
          $value = if ($output.Value.type -is [string] -and $output.Value.type -eq 'string') {
            [string]$output.Value.value
          } else {
            ConvertTo-Json -InputObject $output.Value.value -Depth 100 -Compress
          }
          $value = $value.Replace('%', '%AZP25').Replace("`r", '%0D').Replace("`n", '%0A')
          $secret = ([bool]$output.Value.sensitive).ToString().ToLowerInvariant()
          Write-Host "##vso[task.setvariable variable=$name;issecret=$secret]$value"
        }
      displayName: Set Pre-Action Outputs
      env:
        TERRAFORM_OUTPUTS_PATH: $(TerraformPreOutputs.jsonOutputVariablesPath)

  - ${{ each step in parameters.preActionSteps }}:
    - ${{ each pair in step }}:
        ${{ pair.key }}: ${{ pair.value }}
      env:
        ${{ each secret in parameters.secrets }}:
          TF_VAR_${{ secret }}: $(${{ secret }})
        ${{ each e in parameters.env }}:
          ${{ e.key }}: ${{ e.value }}

  - ${{ if and(eq(parameters.action, 'destroy'), gt(length(parameters.preDestroySteps), 0)) }}:
    - ${{ each step in parameters.preDestroySteps }}:
      - ${{ each pair in step }}:
          ${{ pair.key }}: ${{ pair.value }}

  - ${{ if and(ne(parameters.action, 'apply'), ne(parameters.action, 'output')) }}:
    - task: TerraformTask@5
      displayName: 'terraform ${{ parameters.action }}'
      inputs:
        provider: azurerm
        command: ${{ parameters.action }}
        environmentServiceNameAzureRM: ${{ parameters.servicePrinciple }}
        environmentAzureRmUseIdTokenGeneration: true
        workingDirectory: ${{ parameters.terraformPath }}
        commandOptions: ${{ parameters.commandOptions }}
      env:
        ${{ each secret in parameters.secrets }}:
          TF_VAR_${{ secret }}: $(${{ secret }})
        ${{ each pair in parameters.env }}:
          ${{ pair.key }}: ${{ pair.value }}

  - ${{ if and(eq(parameters.action, 'destroy'), eq(parameters.useWorkspace, true)) }}:
    - task: TerraformTask@5
      displayName: Select Workspace
      inputs:
        provider: azurerm
        workingDirectory: ${{ parameters.terraformPath }}
        command: custom
        customCommand: workspace
        commandOptions: 'select default'
        environmentServiceNameAzureRM: ${{ parameters.servicePrinciple }}
        environmentAzureRmUseIdTokenGeneration: true

    - task: TerraformTask@5
      displayName: Destroy Workspace
      inputs:
        provider: azurerm
        workingDirectory: ${{ parameters.terraformPath }}
        command: custom
        customCommand: workspace
        commandOptions: 'delete "${{ parameters.workspace }}"'
        environmentServiceNameAzureRM: ${{ parameters.servicePrinciple }}
        environmentAzureRmUseIdTokenGeneration: true

  - ${{ if eq(parameters.action, 'apply') }}:
    - task: TerraformTask@5
      name: TerraformPlan
      displayName: 'terraform plan'
      inputs:
        provider: azurerm
        command: plan
        environmentServiceNameAzureRM: ${{ parameters.servicePrinciple }}
        environmentAzureRmUseIdTokenGeneration: true
        workingDirectory: ${{ parameters.terraformPath }}
        commandOptions: '${{ parameters.commandOptions }} -out="$(System.DefaultWorkingDirectory)/terraform.tfplan"'
        publishPlan: 'sds'
      env:
        ${{ each secret in parameters.secrets }}:
          TF_VAR_${{ secret }}: $(${{ secret }})
        ${{ each pair in parameters.env }}:
          ${{ pair.key }}: ${{ pair.value }}

    - powershell: |
        $planJson = terraform show -json "$(System.DefaultWorkingDirectory)/terraform.tfplan"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        $plan = $planJson | ConvertFrom-Json
        Write-Host "##vso[task.setvariable variable=TERRAFORM_PLAN_HAS_DESTROY_CHANGES]false"

        foreach ($resourceChange in $plan.resource_changes) {
          if  ($resourceChange.change.actions.Contains("delete")) {
            Write-Host "##vso[task.setvariable variable=TERRAFORM_PLAN_HAS_DESTROY_CHANGES]$true"
            Write-Host "Destroy detected!"
          }
        }
      displayName: terraform show
      workingDirectory: ${{ parameters.terraformPath }}

    - ${{ each step in parameters.preDestroySteps }}:
      - ${{ each pair in step }}:
          ${{ pair.key }}: ${{ pair.value }}
        condition: and(succeeded(), eq(variables['TERRAFORM_PLAN_HAS_DESTROY_CHANGES'], 'true'))

    - task: TerraformTask@5
      displayName: 'terraform apply'
      condition: and(succeeded(), eq(variables['TerraformPlan.changesPresent'], 'true'))
      inputs:
        provider: azurerm
        command: apply
        environmentServiceNameAzureRM: ${{ parameters.servicePrinciple }}
        environmentAzureRmUseIdTokenGeneration: true
        workingDirectory: ${{ parameters.terraformPath }}
        commandOptions: '"$(System.DefaultWorkingDirectory)/terraform.tfplan"'

  - ${{ if or(eq(parameters.action, 'apply'), eq(parameters.action, 'output')) }}:
    - task: TerraformTask@5
      name: TerraformOutputs
      displayName: 'terraform output'
      inputs:
        provider: azurerm
        command: output
        environmentServiceNameAzureRM: ${{ parameters.servicePrinciple }}
        environmentAzureRmUseIdTokenGeneration: true
        workingDirectory: ${{ parameters.terraformPath }}

    - powershell: |
        $outputs = Get-Content -Raw -LiteralPath $env:TERRAFORM_OUTPUTS_PATH | ConvertFrom-Json
        foreach ($output in $outputs.PSObject.Properties) {
          $name = $output.Name.ToLowerInvariant()
          $value = if ($output.Value.type -is [string] -and $output.Value.type -eq 'string') {
            [string]$output.Value.value
          } else {
            ConvertTo-Json -InputObject $output.Value.value -Depth 100 -Compress
          }
          $value = $value.Replace('%', '%AZP25').Replace("`r", '%0D').Replace("`n", '%0A')
          $secret = ([bool]$output.Value.sensitive).ToString().ToLowerInvariant()
          Write-Host "##vso[task.setvariable variable=$name;isOutput=true;issecret=$secret]$value"
        }
      name: Terraform
      displayName: Set Outputs
      env:
        TERRAFORM_OUTPUTS_PATH: $(TerraformOutputs.jsonOutputVariablesPath)